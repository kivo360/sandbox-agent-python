[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-agent-sdk"
version = "0.2.0"
description = "Python client SDK for Sandbox Agent — universal API for automatic coding agents in sandboxes"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Kevin Hill" },
]
keywords = ["sandbox", "agent", "coding", "ai", "sdk", "acp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "aiortc>=1.9.0,<2",
    "websockets>=12.0,<16",
]

[project.urls]
Homepage = "https://github.com/kivo360/sandbox-agent-python"
Repository = "https://github.com/kivo360/sandbox-agent-python"

[project.scripts]
sandboxagent = "sandboxagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sandboxagent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a running sandbox-agent server",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "A", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
warn_unused_configs = true
